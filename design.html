:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --surface-2: #f1efe9;
  --surface-hover: #f5f3ee;
  --border: #e7e4dc;
  --border-strong: #d9d5c9;
  --text: #1c1b18;
  --text-muted: #726e64;
  --text-faint: #a8a394;
  --accent: #0e6b57;
  --accent-strong: #0a5646;
  --accent-soft: #e3f1eb;
  --accent-contrast: #ffffff;
  --priority-high: #bd4438;
  --priority-medium: #bd8a2d;
  --priority-low: #96917f;
  --danger: #bd4438;
  --danger-soft: #f8e9e6;
  --shadow-sm: 0 1px 2px rgba(28, 27, 24, 0.06);
  --shadow-md: 0 10px 28px rgba(28, 27, 24, 0.10);
  --shadow-lg: 0 24px 64px rgba(28, 27, 24, 0.18);
  --radius-sm: 8px;
  --radius-md: 13px;
  --radius-lg: 20px;
  --font-display: 'Fraunces Display', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --font-body: 'Manrope Var', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131412;
    --surface: #1b1c18;
    --surface-2: #201f1a;
    --surface-hover: #262520;
    --border: #322f27;
    --border-strong: #3e3b31;
    --text: #edece4;
    --text-muted: #9c988c;
    --text-faint: #625e53;
    --accent: #38ae8d;
    --accent-strong: #4bc79f;
    --accent-soft: #17332a;
    --accent-contrast: #0a1512;
    --priority-high: #e07567;
    --priority-medium: #e2b364;
    --priority-low: #86816f;
    --danger: #e07567;
    --danger-soft: #2c1c19;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  --bg: #131412;
  --surface: #1b1c18;
  --surface-2: #201f1a;
  --surface-hover: #262520;
  --border: #322f27;
  --border-strong: #3e3b31;
  --text: #edece4;
  --text-muted: #9c988c;
  --text-faint: #625e53;
  --accent: #38ae8d;
  --accent-strong: #4bc79f;
  --accent-soft: #17332a;
  --accent-contrast: #0a1512;
  --priority-high: #e07567;
  --priority-medium: #e2b364;
  --priority-low: #86816f;
  --danger: #e07567;
  --danger-soft: #2c1c19;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- App shell ---------- */

.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 16px;
}

.wordmark {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: -0.01em;
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 8px;
}

                Light

              <button data-theme-choice="system" class="active">System</button>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 14.5a8.5 8.5 0 1 1-9-11 7 7 0 0 0 9 11z"></path></svg>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const CATEGORIES = [
    { key: 'work', label: 'Work', color: '#5c6b8a' },
    { key: 'personal', label: 'Personal', color: '#b8724f' },
    { key: 'study', label: 'Study', color: '#7a8450' },
    { key: 'health', label: 'Health', color: '#8c6a93' },
  ];

  let tasks = [
    { id: 't1', title: '資料の最終チェック', date: '2026-08-16', time: '10:00', priority: 'high', category: 'work', note: 'クライアント提出前に誤字と数値を確認する', completed: false },
    { id: 't2', title: '牛乳と卵を買う', date: '2026-08-16', time: '18:00', priority: 'medium', category: 'personal', note: '', completed: false },
    { id: 't3', title: '英単語 20個 復習', date: '2026-08-16', time: '', priority: 'low', category: 'study', note: 'Unit 12〜13', completed: false },
    { id: 't4', title: 'ジムでストレッチ', date: '2026-08-16', time: '20:00', priority: 'low', category: 'health', note: '', completed: false },
    { id: 't5', title: 'メールに返信', date: '2026-08-16', time: '09:00', priority: 'medium', category: 'work', note: '', completed: true, completedAt: '2026-08-16' },
    { id: 't6', title: '歯医者の予約', date: '2026-08-17', time: '09:30', priority: 'medium', category: 'personal', note: '', completed: false },
    { id: 't7', title: 'レポート提出', date: '2026-08-19', time: '23:59', priority: 'high', category: 'study', note: '参考文献リストを忘れずに', completed: false },
    { id: 't8', title: '友人と映画', date: '2026-08-19', time: '19:00', priority: 'low', category: 'personal', note: '', completed: false },
    { id: 't9', title: '部屋の掃除', date: '2026-08-22', time: '', priority: 'low', category: 'personal', note: '', completed: false },
    { id: 't10', title: '確定申告の資料をまとめる', date: '', time: '', priority: 'medium', category: 'work', note: '', completed: false },
    { id: 't11', title: '新しいノートPCを検討', date: '', time: '', priority: 'low', category: 'personal', note: '価格と重量を比較', completed: false },
    { id: 't12', title: 'ジムに行く', date: '2026-08-15', time: '', priority: 'low', category: 'health', note: '', completed: true, completedAt: '2026-08-15' },
    { id: 't13', title: '本を返却', date: '2026-08-15', time: '', priority: 'low', category: 'personal', note: '', completed: true, completedAt: '2026-08-15' },
  ];

  const TODAY = '2026-08-16';
  let currentView = 'today';
  let activeCategory = null;
  let editingId = null;

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const iconCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>';
  const iconClock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.3 2"></path></svg>';
  const iconEdit = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>';
  const iconTrash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6"></path><path d="M19 6l-.8 13.4A2 2 0 0 1 16.2 21H7.8a2 2 0 0 1-2-1.6L5 6"></path></svg>';

  function catInfo(key) { return CATEGORIES.find(c => c.key === key); }

  function formatDateJP(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    return `${d.getMonth() + 1}月${d.getDate()}日（${w}）`;
  }

  function relativeGroupLabel(dateStr) {
    const tomorrow = addDays(TODAY, 1);
    if (dateStr === tomorrow) return 'Tomorrow';
    const d = new Date(dateStr + 'T00:00:00');
    const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    return `${d.getMonth() + 1}/${d.getDate()}（${w}）`;
  }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function isOverdue(t) {
    if (!t.date || t.completed) return false;
    if (t.date < TODAY) return true;
    if (t.date === TODAY && t.time) {
      const now = new Date(TODAY + 'T13:30:00');
      const due = new Date(`${t.date}T${t.time}:00`);
      return due < now;
    }
    return false;
  }

  function priorityLabel(p) { return { high: '高', medium: '中', low: '低' }[p]; }

  function buildMetaChips(t) {
    let html = '';
    if (t.time) {
      html += `<span class="meta-chip meta-time ${isOverdue(t) ? 'overdue' : ''}">${iconClock}${t.time}</span>`;
    }
    html += `<span class="meta-chip"><span class="priority-dot ${t.priority}"></span>優先度: ${priorityLabel(t.priority)}</span>`;
    const c = catInfo(t.category);
    if (c) html += `<span class="cat-chip" style="--dot:${c.color}"><span class="cat-dot"></span>${c.label}</span>`;
    return html;
  }

  function createTaskRow(t) {
    const row = document.createElement('div');
    row.className = 'task-row' + (t.completed ? ' done' : '');
    row.dataset.id = t.id;

    const check = document.createElement('button');
    check.className = 'checkbox';
    check.innerHTML = iconCheck;
    check.setAttribute('aria-label', '完了にする');
    check.addEventListener('click', (e) => { e.stopPropagation(); toggleComplete(t.id); });

    const mainEl = document.createElement('div');
    mainEl.className = 'task-main';
    const titleEl = document.createElement('div');
    titleEl.className = 'task-title';
    titleEl.textContent = t.title;
    const metaEl = document.createElement('div');
    metaEl.className = 'task-meta';
    metaEl.innerHTML = buildMetaChips(t);
    mainEl.appendChild(titleEl);
    mainEl.appendChild(metaEl);
    mainEl.addEventListener('click', () => openEditModal(t.id));

    const actions = document.createElement('div');
    actions.className = 'task-actions';
    actions.innerHTML = `
      <button class="icon-btn" data-act="edit" title="編集">${iconEdit}</button>
      <button class="icon-btn danger" data-act="delete" title="削除">${iconTrash}</button>
    `;
    actions.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openEditModal(t.id); });
    actions.querySelector('[data-act="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteTask(t.id); });

    row.appendChild(check);
    row.appendChild(mainEl);
    row.appendChild(actions);
    return row;
  }

  function emptyState(icon, title, desc) {
    const el = document.createElement('div');
    el.className = 'empty-state';
    el.innerHTML = `<div class="empty-icon">${icon}</div><h3>${title}</h3><p>${desc}</p>`;
    return el;
  }

  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const ICON_INBOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>';
  const ICON_CHECK_CIRCLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><path d="M8.3 12.3l2.4 2.4 5-5"></path></svg>';

  function filteredTasks(list) {
    return activeCategory ? list.filter(t => t.category === activeCategory) : list;
  }

  function renderToday() {
    const list = $('#list-today');
    list.innerHTML = '';
    let items = filteredTasks(tasks.filter(t => t.date === TODAY));
    const active = items.filter(t => !t.completed).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    const done = items.filter(t => t.completed);

    if (items.length === 0) {
      list.appendChild(emptyState(ICON_SUN, '今日のタスクはありません', '「Add task」から今日やることを追加しましょう。'));
    } else {
      active.forEach(t => list.appendChild(createTaskRow(t)));
      if (done.length) {
        const block = document.createElement('div');
        block.className = 'group-block';
        block.innerHTML = `<div class="group-eyebrow">完了済み（${done.length}）</div>`;
        const inner = document.createElement('div');
        inner.className = 'task-list';
        done.forEach(t => inner.appendChild(createTaskRow(t)));
        block.appendChild(inner);
        list.appendChild(block);
      }
    }

    const remaining = active.length;
    $('#todaySubtitle').textContent = `${formatDateJP(TODAY)}${remaining ? ` ・ 残り ${remaining} 件` : ' ・ すべて完了'}`;
  }

  function renderInbox() {
    const list = $('#list-inbox');
    list.innerHTML = '';
    const items = filteredTasks(tasks.filter(t => !t.date && !t.completed));
    if (items.length === 0) {
      list.appendChild(emptyState(ICON_INBOX, 'Inboxは空です', '日付が決まっていないタスクはここに集まります。'));
    } else {
      items.forEach(t => list.appendChild(createTaskRow(t)));
    }
  }

  function renderUpcoming() {
    const wrap = $('#list-upcoming');
    wrap.innerHTML = '';
    const items = filteredTasks(tasks.filter(t => t.date && t.date > TODAY && !t.completed));
    if (items.length === 0) {
      wrap.appendChild(emptyState(ICON_SUN, '予定はまだありません', '先の予定を追加すると、ここに日付ごとに表示されます。'));
      return;
    }
    const byDate = {};
    items.forEach(t => { (byDate[t.date] ||= []).push(t); });
    Object.keys(byDate).sort().forEach(date => {
      const group = byDate[date].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
      const block = document.createElement('div');
      block.className = 'group-block';
      block.innerHTML = `<div class="group-eyebrow">${relativeGroupLabel(date)}</div>`;
      const inner = document.createElement('div');
      inner.className = 'task-list';
      group.forEach(t => inner.appendChild(createTaskRow(t)));
      block.appendChild(inner);
      wrap.appendChild(block);
    });
  }

  function renderCompleted() {
    const wrap = $('#list-completed');
    wrap.innerHTML = '';
    const items = filteredTasks(tasks.filter(t => t.completed)).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
    $('#completedSubtitle').textContent = `${items.length} 件のタスクを完了しました`;
    if (items.length === 0) {
      wrap.appendChild(emptyState(ICON_CHECK_CIRCLE, 'まだ完了したタスクがありません', 'タスクを完了すると、ここに記録されます。'));
      return;
    }
    const byDate = {};
    items.forEach(t => { (byDate[t.completedAt] ||= []).push(t); });
    Object.keys(byDate).sort().reverse().forEach(date => {
      const label = date === TODAY ? '今日' : date === addDays(TODAY, -1) ? '昨日' : relativeGroupLabel(date);
      const block = document.createElement('div');
      block.className = 'group-block';
      block.innerHTML = `<div class="group-eyebrow">${label}</div>`;
      const inner = document.createElement('div');
      inner.className = 'task-list';
      byDate[date].forEach(t => inner.appendChild(createTaskRow(t)));
      block.appendChild(inner);
      wrap.appendChild(block);
    });
  }

  function renderCounts() {
    $('[data-count="inbox"]').textContent = tasks.filter(t => !t.date && !t.completed).length || '';
    $('[data-count="today"]').textContent = tasks.filter(t => t.date === TODAY && !t.completed).length || '';
    $('[data-count="upcoming"]').textContent = tasks.filter(t => t.date && t.date > TODAY && !t.completed).length || '';
    $('[data-count="completed"]').textContent = tasks.filter(t => t.completed).length || '';
  }

  function renderCategorySidebar() {
    const wrap = $('#categoryList');
    wrap.innerHTML = '';
    const allBtn = document.createElement('button');
    allBtn.className = 'category-item' + (activeCategory === null ? ' active' : '');
    allBtn.innerHTML = `<span class="cat-dot" style="--dot:var(--text-faint)"></span>すべて<span class="count">${tasks.filter(t => !t.completed).length}</span>`;
    allBtn.addEventListener('click', () => { activeCategory = null; renderAll(); });
    wrap.appendChild(allBtn);
    CATEGORIES.forEach(c => {
      const count = tasks.filter(t => t.category === c.key && !t.completed).length;
      const btn = document.createElement('button');
      btn.className = 'category-item' + (activeCategory === c.key ? ' active' : '');
      btn.innerHTML = `<span class="cat-dot" style="--dot:${c.color}"></span>${c.label}<span class="count">${count}</span>`;
      btn.addEventListener('click', () => { activeCategory = c.key; renderAll(); });
      wrap.appendChild(btn);
    });
  }

  function renderCategoryManage() {
    const wrap = $('#categoryManageList');
    wrap.innerHTML = '';
    CATEGORIES.forEach(c => {
      const count = tasks.filter(t => t.category === c.key).length;
      const el = document.createElement('div');
      el.className = 'category-manage-item';
      el.innerHTML = `<span class="cat-dot" style="--dot:${c.color}"></span><span>${c.label}</span><span class="count">${count}</span>`;
      wrap.appendChild(el);
    });
  }

  function populateCategorySelect() {
    const sel = $('#taskCategorySelect');
    sel.innerHTML = CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
  }

  function renderAll() {
    renderToday();
    renderInbox();
    renderUpcoming();
    renderCompleted();
    renderCounts();
    renderCategorySidebar();
    renderCategoryManage();
  }

  function toggleComplete(id) {
    const t = tasks.find(t => t.id === id);
    t.completed = !t.completed;
    if (t.completed) t.completedAt = TODAY; else delete t.completedAt;
    renderAll();
    showToast(t.completed ? 'タスクを完了しました' : '未完了に戻しました');
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    renderAll();
    showToast('タスクを削除しました');
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- View switching ---------- */

  function switchView(view) {
    currentView = view;
    $$('.view').forEach(v => v.classList.remove('active'));
    $(`#view-${view}`).classList.add('active');
    $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    $$('#mobileTabbar button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    if (view !== 'today' && view !== 'inbox' && view !== 'upcoming' && view !== 'completed') {
      activeCategory = null;
    }
    $('.main').scrollTo({ top: 0 });
  }

  $$('.nav-item').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $$('#mobileTabbar button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('#settingsBtn').addEventListener('click', () => switchView('settings'));
  $('#sidebarUserBtn').addEventListener('click', () => switchView('settings'));
  $('#avatarBtn').addEventListener('click', () => switchView('settings'));

  /* ---------- Modal ---------- */

  const overlay = $('#modalOverlay');
  const nameInput = $('#taskNameInput');
  const dateInput = $('#taskDateInput');
  const timeInput = $('#taskTimeInput');
  const catSelect = $('#taskCategorySelect');
  const noteInput = $('#taskNoteInput');
  const saveBtn = $('#saveTaskBtn');
  const deleteBtn = $('#deleteTaskBtn');
  let currentPriority = 'medium';

  function setPriority(p) {
    currentPriority = p;
    $$('#priorityPicker button').forEach(b => b.classList.toggle('active', b.dataset.priority === p));
  }
  $$('#priorityPicker button').forEach(b => b.addEventListener('click', () => setPriority(b.dataset.priority)));

  function openAddModal() {
    editingId = null;
    nameInput.value = '';
    dateInput.value = currentView === 'today' ? TODAY : '';
    timeInput.value = '';
    catSelect.value = activeCategory || CATEGORIES[0].key;
    noteInput.value = '';
    setPriority('medium');
    saveBtn.textContent = '追加';
    saveBtn.disabled = true;
    deleteBtn.classList.add('hidden');
    openModal();
  }

  function openEditModal(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    editingId = id;
    nameInput.value = t.title;
    dateInput.value = t.date || '';
    timeInput.value = t.time || '';
    catSelect.value = t.category;
    noteInput.value = t.note || '';
    setPriority(t.priority);
    saveBtn.textContent = '保存';
    saveBtn.disabled = false;
    deleteBtn.classList.remove('hidden');
    openModal();
  }

  function openModal() {
    overlay.classList.add('open');
    setTimeout(() => nameInput.focus(), 50);
  }
  function closeModal() { overlay.classList.remove('open'); }

  nameInput.addEventListener('input', () => { saveBtn.disabled = nameInput.value.trim().length === 0; });

  $$('[data-add]').forEach(b => b.addEventListener('click', openAddModal));
  $('#fabAdd').addEventListener('click', openAddModal);
  $('#cancelModalBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  saveBtn.addEventListener('click', () => {
    const title = nameInput.value.trim();
    if (!title) return;
    if (editingId) {
      const t = tasks.find(t => t.id === editingId);
      t.title = title; t.date = dateInput.value; t.time = timeInput.value;
      t.category = catSelect.value; t.note = noteInput.value; t.priority = currentPriority;
      showToast('タスクを更新しました');
    } else {
      tasks.push({
        id: 't' + Date.now(), title, date: dateInput.value, time: timeInput.value,
        category: catSelect.value, note: noteInput.value, priority: currentPriority, completed: false
      });
      showToast('タスクを追加しました');
    }
    closeModal();
    renderAll();
  });

  deleteBtn.addEventListener('click', () => {
    if (editingId) deleteTask(editingId);
    closeModal();
  });

  /* ---------- Settings: theme ---------- */

  $$('#themeSegmented button').forEach(b => b.addEventListener('click', () => {
    const choice = b.dataset.themeChoice;
    $$('#themeSegmented button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (choice === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', choice);
  }));

  $$('#notifySegmented button').forEach(b => b.addEventListener('click', () => {
    $$('#notifySegmented button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  /* ---------- Init ---------- */

  $('#todayPill').textContent = formatDateJP(TODAY);
  populateCategorySelect();
  renderAll();
})();
</script>
